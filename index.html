<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offres QuickSleeper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="pricing">
        <article class="pricing-card pricing-card--life">
            <span class="pricing-card__badge">LIFE</span>
            <div class="pricing-card__content">
                <h2 class="pricing-card__title">Sans engagement</h2>
                <p class="pricing-card__subtitle">QuickSleeper®</p>
            </div>
            <div class="pricing-card__price">
                <span class="pricing-card__amount">199€</span>
                <span class="pricing-card__note">TTC / mois</span>
            </div>
        </article>
        <article class="pricing-card pricing-card--life pricing-card--lease">
            <span class="pricing-card__badge">LIFE</span>
            <div class="pricing-card__content">
                <h2 class="pricing-card__title">Location 48 mois</h2>
                <p class="pricing-card__subtitle">QuickSleeper®</p>
            </div>
            <div class="pricing-card__price">
                <span class="pricing-card__amount pricing-card__amount--highlight">159€</span>
                <span class="pricing-card__note">TTC / mois</span>
            </div>
        </article>
        <article class="pricing-card pricing-card--quicksleeper">
            <span class="pricing-card__badge">QUICKSLEEPER</span>
            <div class="pricing-card__content">
                <h2 class="pricing-card__title">Comptant</h2>
                <p class="pricing-card__subtitle">Sur devis</p>
            </div>
            <p class="pricing-card__footer">(paiement unique)</p>
        </article>
    </main>
</body>
</html>
